services:
  prod:
    build:
      context: .
      args:
        VERSION: ${APP_VERSION:-1.0.0}
    ports:
      - "8081:80"
    volumes:
      - ./app/Http/Controllers:/app/controllers:ro
      - mcp-sessions:/app/storage/mcp-sessions
    environment:
      - MCP_SERVER_NAME=${MCP_SERVER_NAME:-cronitor-mcp}
      - MCP_CONTROLLER_PATHS=controllers
      - CRONITOR_API_KEY=${CRONITOR_API_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
    restart: unless-stopped
    profiles:
      - prod

  dev:
    build:
      context: .
      target: build
    ports:
      - "8080:80"
    volumes:
      - .:/app
      - ./Caddyfile:/etc/frankenphp/Caddyfile:ro
    environment:
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_VERSION=${APP_VERSION:-0.0.0-dev}
      - MCP_SERVER_NAME=${MCP_SERVER_NAME:-cronitor-mcp-dev}
      - MCP_CONTROLLER_PATHS=app/Http/Controllers
      - CRONITOR_API_KEY=${CRONITOR_API_KEY}
    command: frankenphp run --config /etc/frankenphp/Caddyfile

  composer:
    build:
      target: build
    volumes:
      - .:/app
    profiles:
      - composer

volumes:
  mcp-sessions: